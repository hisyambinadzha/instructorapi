spring.application.name=instructorapi
server.port=8080

spring.mongodb.username=user
spring.mongodb.password=password
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=trainingdb
spring.mongodb.authentication-database=admin

# optional for debugging
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.mongodb.driver=INFO
