services:
  mongo:
    image: mongo:8
    container_name: nfs-java-mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - ./init-scripts/:/docker-entrypoint-initdb.d/:ro
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfs-java-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_USERNAME: user
      MONGO_PASSWORD: password
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: trainingdb
      MONGO_AUTH_DATABASE: admin
      JWT_SECRET: XhXH96vnxEAD1i53Jk+1w9/5RwMqjYXEZlGJUmj7udU=
    depends_on:
      - mongo
  
  frontend:
    build:
      context: C:\Users\Admin\Documents\Certified Full Stack Java with AI\Labs\day-11-03052026\instructor-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: nfs-java-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:

